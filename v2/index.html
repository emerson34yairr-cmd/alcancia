/* Fila de movimiento, reutilizada en Hoy, Actividad y el detalle del día. */
function entryRow(e) {
  const isEarn = e.kind === 'earn';
  const isSave = e.kind === 'save';
  const isOut = e.src === 'retiro';
  const c = isEarn ? (FUENTE_BY_ID[e.cat] || FUENTE_BY_ID.otro_ing) : cat(e.cat);
  const tone = isEarn ? 'pos' : isSave ? (isOut ? 'warn' : 'save') : 'neg';
  const icon = isEarn ? 'up' : isSave ? (isOut ? 'download' : 'piggy') : 'down';
  const title = e.note || (isSave ? (isOut ? 'Retiro de la alcancía' : 'A la alcancía') : c.name);
  const meta = isSave ? (isOut ? 'Salió de la alcancía' : 'Guardado')
             : c.name + (e.src === 'compra' ? ' · desde compras' : e.src === 'scan' ? ' · recibo' : '');
  return '' +
  '<button class="row" type="button" data-act="ver-mov" data-id="' + esc(e.id) + '">' +
    '<span class="badge badge--' + tone + '">' + ico(icon, 18) + '</span>' +
    '<span class="row__body">' +
      '<span class="row__title">' + esc(title) + '</span>' +
      '<span class="row__meta">' + esc(meta) + '</span>' +
    '</span>' +
    /* El importe se guarda siempre positivo; el signo lo pone el tipo de
       movimiento. Se antepone solo cuando hay cifra que enseñar, para que en
       modo privacidad no quede un '−••••' sin sentido. */
    '<span class="row__amount num ' + tone + '">' +
      (state.privacy ? '' : (isEarn ? '+' : isSave ? (isOut ? '−' : '') : '−')) +
      money(e.amount) +
    '</span>' +
  '</button>';
}

/* Resumen del día en una frase. La versión anterior encadenaba ifs y siempre
   ganaba el último que coincidía, así que el mensaje solía no corresponder
   a la situación real; aquí se elige el caso más relevante, una sola vez. */
function briefCard() {
  const today = dayKey();
  const dt = totals(ofDay(today));
  const w = lastNDays(7);
  const wt = totals(inRange(w.from, w.to));
  const pend = state.shop.filter(function (i) { return !i.done; }).length;
  const st = streak();

  let icon = 'sparkles', tone = 'brand', title, text, act = null, actLabel = '';

  if (!state.entries.length) {
    title = 'Empieza tu alcancía';
    text = 'Registra lo que ganaste hoy y verás el cerdito llenarse.';
    act = 'nuevo:earn'; actLabel = 'Registrar';
  } else if (dt.spent > 0 && dt.spent > dt.earned + dt.saved) {
    icon = 'alert'; tone = 'warn';
    title = 'Hoy gastaste más de lo que entró';
    text = 'Llevas ' + money(dt.spent) + ' de gasto contra ' + money(dt.earned) + ' de ingreso.';
  } else if (dt.saved > 0) {
    icon = 'piggy'; tone = 'save';
    title = 'Vas bien hoy';
    text = 'Ya guardaste ' + money(dt.saved) + ' en la alcancía.';
  } else if (!ofDay(today).length && st > 0) {
    icon = 'flame'; tone = 'warn';
    title = 'Tu racha de ' + st + (st === 1 ? ' día' : ' días') + ' sigue viva';
    text = 'Registra algo hoy para no romperla.';
    act = 'nuevo:earn'; actLabel = 'Registrar';
  } else if (pend > 0) {
    icon = 'cart'; tone = 'brand';
    title = pend === 1 ? '1 cosa pendiente de comprar' : pend + ' cosas pendientes de comprar';
    text = 'Tu lista de compras te está esperando.';
    act = 'ir:compras'; actLabel = 'Ver lista';
  } else {
    icon = 'sparkles'; tone = 'brand';
    title = 'Semana en curso';
    text = 'Ahorrado ' + money(wt.saved) + ' · gastado ' + money(wt.spent) + ' en 7 días.';
  }

  return '' +
  '<section class="card brief">' +
    '<span class="badge badge--' + tone + '">' + ico(icon, 20) + '</span>' +
    '<div class="grow">' +
      '<div class="brief__title">' + esc(title) + '</div>' +
      '<div class="t-cap muted">' + esc(text) + '</div>' +
    '</div>' +
    (act ? '<button class="btn btn--soft brief__cta" type="button" data-act="brief" ' +
           'data-go="' + act + '">' + esc(actLabel) + '</button>' : '') +
  '</section>';
}

/* ── 8. REGISTRAR UN MOVIMIENTO ──────────────────────────────────────────── */

const KINDS = {
  earn:  { name: 'Ganado',   verb: 'Ingreso',  tone: 'pos',  icon: 'up',    cats: FUENTES },
  save:  { name: 'Ahorrado', verb: 'Ahorro',   tone: 'save', icon: 'piggy', cats: null },
  spend: { name: 'Gastado',  verb: 'Gasto',    tone: 'neg',  icon: 'down',  cats: CATS },
};

function openEntrySheet(kind, existing) {
  const k = KINDS[kind] ? kind : 'spend';
  const conf = KINDS[k];
  const ed = existing || null;
  const sym = (MONEDAS[state.currency] || MONEDAS.USD).sym;
  const val = ed ? String(Math.round(toView(ed.amount) * 100) / 100) : '';
  const selCat = ed ? ed.cat : (k === 'earn' ? 'trabajo' : k === 'spend' ? 'food' : null);
  const date = ed ? ed.date : dayKey();

  const body = '' +
  '<div class="seg" id="kindSeg">' +
    Object.keys(KINDS).map(function (id) {
      return '<button class="seg__btn' + (id === k ? ' is-on' : '') + '" type="button" ' +
             'data-act="cambiar-tipo" data-kind="' + id + '">' + KINDS[id].name + '</button>';
    }).join('') +
  '</div>' +

  '<div class="amount">' +
    '<span class="amount__sym">' + esc(sym) + '</span>' +
    '<input class="amount__in num" id="mAmount" type="text" inputmode="decimal" ' +
      'placeholder="0" value="' + esc(val) + '" autocomplete="off" ' +
      'aria-label="Cantidad">' +
  '</div>' +

  (conf.cats
    ? '<div class="field">' +
        '<span class="field__label">' + (k === 'earn' ? '¿De dónde vino?' : 'Categoría') + '</span>' +
        '<div class="catgrid" id="mCats">' +
          conf.cats.map(function (c) {
            return '<button class="catopt' + (c.id === selCat ? ' is-on' : '') + '" type="button" ' +
                   'data-act="elegir-cat" data-cat="' + c.id + '">' +
                   (c.icon ? ico(c.icon, 18) : '') +
                   '<span>' + esc(c.name) + '</span></button>';
          }).join('') +
        '</div>' +
      '</div>'
    : '<div class="field">' +
        '<span class="field__label">Movimiento</span>' +
        '<div class="seg" id="mDir">' +
          '<button class="seg__btn' + (!ed || ed.src !== 'retiro' ? ' is-on' : '') + '" type="button" ' +
            'data-act="dir-ahorro" data-dir="in">Meter a la alcancía</button>' +
          '<button class="seg__btn' + (ed && ed.src === 'retiro' ? ' is-on' : '') + '" type="button" ' +
            'data-act="dir-ahorro" data-dir="out">Sacar</button>' +
        '</div>' +
      '</div>') +

  '<div class="field">' +
    '<label class="field__label" for="mNote">Nota <span class="faint">(opcional)</span></label>' +
    '<input class="input" id="mNote" type="text" maxlength="200" ' +
      'placeholder="' + (k === 'spend' ? 'Taxi, almuerzo…' : k === 'earn' ? 'Turno del sábado…' : 'Para la meta…') + '" ' +
      'value="' + esc(ed ? ed.note : '') + '">' +
  '</div>' +

  '<div class="field">' +
    '<label class="field__label" for="mDate">Fecha</label>' +
    '<input class="input" id="mDate" type="date" value="' + esc(date) + '" max="' + esc(dayKey()) + '">' +
  '</div>' +

  '<div class="hstack" style="gap:var(--s2)">' +
    (ed ? '<button class="btn btn--danger" type="button" data-act="borrar-mov" ' +
          'data-id="' + esc(ed.id) + '">' + ico('trash', 18) + 'Borrar</button>' : '') +
    '<button class="btn btn--primary btn--lg grow" type="button" data-act="guardar-mov" ' +
      'data-kind="' + k + '"' + (ed ? ' data-id="' + esc(ed.id) + '"' : '') + '>' +
      (ed ? 'Guardar cambios' : 'Registrar ' + conf.verb.toLowerCase()) + '</button>' +
  '</div>';

  openSheet(ed ? 'Editar ' + conf.verb.toLowerCase() : 'Nuevo ' + conf.verb.toLowerCase(), body);

  const inp = $('#mAmount');
  if (inp) {
    /* Solo dígitos y un separador decimal. Filtrar al escribir evita el
       NaN que se colaba hasta los totales en la versión anterior. */
    inp.addEventListener('input', function () {
      let v = inp.value.replace(/[^\d.,]/g, '').replace(',', '.');
      const parts = v.split('.');
      if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
      if (parts[1] && parts[1].length > 2) v = parts[0] + '.' + parts[1].slice(0, 2);
      inp.value = v;
    });
    setTimeout(function () { inp.focus(); }, 340);
  }
}

/* Lee la hoja abierta y devuelve el movimiento, o null si no es válido. */
function readEntrySheet(kind, id) {
  const raw = ($('#mAmount') || {}).value || '';
  const shown = parseFloat(raw.replace(',', '.'));
  if (!isFinite(shown) || shown <= 0) {
    toast('Escribe una cantidad mayor que cero', 'bad');
    const i = $('#mAmount'); if (i) i.focus();
    return null;
  }
  const dateEl = $('#mDate');
  const date = dateEl && DATE_RE.test(dateEl.value) ? dateEl.value : dayKey();
  const on = $('.catopt.is-on');
  const dirOut = !!$('#mDir .seg__btn.is-on[data-dir="out"]');
  const prev = id ? state.entries.find(function (e) { return e.id === id; }) : null;

  return {
    id: id || uid(),
    date: date,
    kind: kind,
    /* Se guarda en USD, la unidad base. Lo escrito está en la moneda activa. */
    amount: toBase(shown),

    grp: prev ? prev.grp : null,
    src: kind === 'save' && dirOut ? 'retiro' : (prev ? (prev.src === 'retiro' ? null : prev.src) : null),
  };
}

function filtered() {
  const f = state.filters;
  let from = '0000-00-00', to = '9999-99-99';
  if (f.range === '7')  { const w = lastNDays(7);  from = w.from; to = w.to; }
  if (f.range === '30') { const w = lastNDays(30); from = w.from; to = w.to; }
  if (f.range === 'mes'){ const w = thisMonth();   from = w.from; to = w.to; }
  const q = f.q.trim().toLowerCase();

  return state.entries.filter(function (e) {
    if (e.date < from || e.date > to) return false;
    if (f.kind !== 'all' && e.kind !== f.kind) return false;
    /* El filtro de categoría solo aplica a gastos: en la versión anterior se
       aplicaba también a ingresos y ahorros, que heredaban la categoría de la
       línea, y por eso filtrar por "Comida" hacía aparecer sueldos. */
    if (f.cat !== 'all') {
      if (e.kind !== 'spend') return false;
      if (e.cat !== f.cat) return false;
    }
    if (q) {
      const hay = (e.note + ' ' +
        (e.kind === 'spend' ? cat(e.cat).name : e.kind === 'earn'
          ? (FUENTE_BY_ID[e.cat] || {}).name || '' : 'ahorro')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

/* Gráfica de línea del ahorro acumulado. SVG puro, sin librerías. */
function lineChart(points, tone) {
  if (points.length < 2) return '';
  const W = 320, H = 120, pad = 6;
  const max = Math.max.apply(null, points) || 1;
  const xs = function (i) { return pad + (W - pad * 2) * (i / (points.length - 1)); };
  const ys = function (v) { return H - pad - (H - pad * 2) * (v / max); };
  let d = 'M' + xs(0).toFixed(1) + ' ' + ys(points[0]).toFixed(1);
  for (let i = 1; i < points.length; i++) {
    /* Curva suave: el punto de control va a media distancia en X, lo que
       redondea la línea sin inventar valores entre dos puntos reales. */
    const x0 = xs(i - 1), x1 = xs(i), mx = (x0 + x1) / 2;
    d += ' C' + mx.toFixed(1) + ' ' + ys(points[i - 1]).toFixed(1) +
         ' ' + mx.toFixed(1) + ' ' + ys(points[i]).toFixed(1) +
         ' ' + x1.toFixed(1) + ' ' + ys(points[i]).toFixed(1);
  }
  const area = d + ' L' + xs(points.length - 1).toFixed(1) + ' ' + H + ' L' + xs(0).toFixed(1) + ' ' + H + ' Z';
  return '' +
  '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="lgFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="var(--' + tone + ')" stop-opacity="0.28"/>' +
      '<stop offset="1" stop-color="var(--' + tone + ')" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#lgFill)"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--' + tone + ')" stroke-width="2.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
  '</svg>';
}

          return '<div class="catbar">' +

/* Variación contra el periodo anterior. En gastos, subir es malo: el color se
   invierte para que verde signifique siempre "vas bien". */
function deltaLabel(cur, prev, lowerIsBetter) {
  if (!prev && !cur) return '<span class="faint">Sin datos</span>';
  if (!prev) return '<span class="pos">Nuevo</span>';
  const d = (cur - prev) / prev * 100;
  if (Math.abs(d) < 0.5) return '<span class="faint">Igual</span>';
  const up = d > 0;
  const good = lowerIsBetter ? !up : up;
  return '<span class="' + (good ? 'pos' : 'neg') + '">' +
         (up ? '↑' : '↓') + ' ' + Math.abs(Math.round(d)) + '%</span>';
}

/* Mapa de constancia: 12 semanas, una columna por semana, lunes arriba. */
function heatmapCard() {
  const hoy = dayKey();
  const finSemana = addDays(startOfWeek(hoy), 6);
  const inicio = addDays(finSemana, -(12 * 7 - 1));
  const saved = {};
  state.entries.forEach(function (e) {
    if (e.kind !== 'save' || e.date < inicio) return;
    saved[e.date] = (saved[e.date] || 0) + (e.src === 'retiro' ? -e.amount : e.amount);
  });
  const max = Math.max.apply(null, [1].concat(Object.keys(saved).map(function (k) { return saved[k]; })));

  let cells = '';
  for (let row = 0; row < 7; row++) {
    for (let col = 0; col < 12; col++) {
      const k = addDays(inicio, col * 7 + row);
      const futuro = k > hoy;
      const v = saved[k] || 0;
      const lvl = futuro ? -1 : v <= 0 ? 0 : v / max >= 0.75 ? 4 : v / max >= 0.5 ? 3 : v / max >= 0.25 ? 2 : 1;
      cells += '<div class="heat__c' + (lvl > 0 ? ' l' + lvl : '') + (futuro ? ' is-future' : '') + '"' +
               (futuro ? '' : ' title="' + esc(fmtDate(k)) + ': ' + money(v, { force: true }) + '"') +
               '></div>';
    }
  }
  return '' +
  '<section class="card stack-2">' +
    '<div class="spread">' +
      '<div class="card__label">Constancia de ahorro</div>' +
      '<span class="t-cap faint">12 semanas</span>' +
    '</div>' +
    '<div class="heat">' + cells + '</div>' +
    '<div class="heat__legend t-cap faint">' +
      '<span>Menos</span>' +
      '<span class="heat__c"></span><span class="heat__c l1"></span>' +
      '<span class="heat__c l2"></span><span class="heat__c l3"></span><span class="heat__c l4"></span>' +
      '<span>Más</span>' +
    '</div>' +
  '</section>';
}

/* Cierra las metas ya alcanzadas y despierta los logros pendientes.
   Se ejecuta al arrancar y tras cada cambio, no solo al registrar un
   movimiento: así los datos importados de la versión anterior también
   reconocen lo que ya estaba ganado. */
function reconcile() {
  let cambio = false;
  state.goals.forEach(function (g) {
    if (!g.done && g.target > 0 && goalSaved(g) >= g.target) {
      g.done = true;
      g.doneAt = g.doneAt || dayKey();
      cambio = true;
    }
  });
  const nuevos = checkLogros();
  if (nuevos.length) cambio = true;
  return { changed: cambio, nuevos: nuevos };
}

function goalCard(g) {
  const real = goalSaved(g);
  /* Se enseña topado al objetivo: "$500 de $320" se lee como un error. El
     excedente se menciona aparte, en su propia línea. */
  const saved = Math.min(real, g.target);
  const p = goalPct(g);
  const falta = Math.max(0, g.target - real);
  const extra = Math.max(0, real - g.target);
  const dias = g.due && falta > 0 ? daysBetween(dayKey(), g.due) : null;

  /* Ritmo necesario: cuánto habría que guardar al día para llegar a tiempo.
     Es el dato que de verdad orienta, y la versión anterior no lo daba. */
  let ritmo = '';
  if (!g.done && dias !== null && dias > 0 && falta > 0) {
    ritmo = money(falta / dias) + ' al día para llegar';
  } else if (!g.done && dias !== null && dias <= 0 && falta > 0) {
    ritmo = 'La fecha ya pasó';
  }

  return '' +
  '<section class="card stack-2 goal' + (g.done ? ' is-done' : '') + '">' +
    '<div class="spread">' +
      '<div class="grow">' +
        '<div class="goal__name">' + (g.done ? '✅ ' : '') + esc(g.name) + '</div>' +
        '<div class="t-cap faint">Desde el ' + esc(fmtDate(g.since)) +
          (g.due ? ' · para el ' + esc(fmtDate(g.due)) : '') + '</div>' +
      '</div>' +
      '<button class="iconbtn" type="button" data-act="editar-meta" data-id="' + esc(g.id) + '" ' +
        'aria-label="Editar meta">' + ico('edit', 17) + '</button>' +
    '</div>' +

    '<div class="bar"><div class="bar__fill' + (g.done ? ' bar__fill--pos' : '') + '" ' +
      'data-grow="' + p + '"></div></div>' +

    '<div class="spread t-cap">' +
      '<span class="num"><b>' + money(saved) + '</b><span class="faint"> de ' + money(g.target) + '</span></span>' +
      '<span class="goal__pct num">' + p + '%</span>' +
    '</div>' +

    (g.done
      ? '<div class="t-cap pos">Cumplida el ' + esc(fmtDate(g.doneAt || dayKey())) +
        (extra > 0 ? ' · ' + money(extra) + ' de más' : '') + '</div>'
      : '<div class="t-cap faint">' +
          'Te faltan ' + money(falta) +
          (dias !== null && dias > 0 ? ' · ' + dias + (dias === 1 ? ' día' : ' días') : '') +
          (ritmo ? ' · ' + esc(ritmo) : '') +
        '</div>') +
  '</section>';
}

/* ── 17. FOTOS DEL DÍA (IndexedDB) ───────────────────────────────────────── */

/* Se reutiliza la MISMA base que la versión anterior, así que las fotos que
   ya tenías aparecen sin migrar nada. Van en IndexedDB y no en localStorage
   a propósito: una sola foto llenaría la cuota y tumbaría todo lo demás. */
const FOTO_DB = 'alcanciaFotos', FOTO_STORE = 'dayPhotos', FOTO_MAX = 1280;
let dbP = null;

function db() {
  if (dbP) return dbP;
  dbP = new Promise(function (res, rej) {
    if (!window.indexedDB) return rej(new Error('sin indexedDB'));
    const rq = indexedDB.open(FOTO_DB, 1);
    rq.onupgradeneeded = function () {
      const d = rq.result;
      if (!d.objectStoreNames.contains(FOTO_STORE)) d.createObjectStore(FOTO_STORE, { keyPath: 'key' });
    };
    rq.onsuccess = function () { res(rq.result); };
    rq.onerror = function () { rej(rq.error); };
  });
  return dbP;
}

function fotoTx(mode, fn) {
  return db().then(function (d) {
    return new Promise(function (res, rej) {
      const tx = d.transaction(FOTO_STORE, mode);
      const rq = fn(tx.objectStore(FOTO_STORE));
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error); };
    });
  });
}
function fotoGet(k)  { return fotoTx('readonly',  function (s) { return s.get(k); }); }
function fotoPut(r)  { return fotoTx('readwrite', function (s) { return s.put(r); }); }
function fotoDel(k)  { return fotoTx('readwrite', function (s) { return s.delete(k); }); }
function fotoKeys()  { return fotoTx('readonly',  function (s) { return s.getAllKeys(); }); }

/* Reduce la imagen antes de guardarla. Una foto de iPhone son ~4 MB; a 1280 px
   de lado mayor y JPEG queda en unos 200 KB sin perder legibilidad para un
   recibo. */
function encogerFoto(file) {
  return new Promise(function (res, rej) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      const sc = Math.min(1, FOTO_MAX / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * sc));
      const h = Math.max(1, Math.round(img.height * sc));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(function (blob) {
        if (!blob) return rej(new Error('sin blob'));
        res({ blob: blob, w: w, h: h, bytes: blob.size, type: 'image/jpeg' });
      }, 'image/jpeg', 0.72);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('no se pudo leer')); };
    img.src = url;
  });
}

/* Claves con foto, en memoria, para poder marcar los días en la cuadrícula
   sin abrir una transacción por celda. */
let fotoSet = {};
function cargarFotoKeys() {
  return fotoKeys().then(function (ks) {
    fotoSet = {};
    (ks || []).forEach(function (k) { fotoSet[k] = true; });
  }).catch(function () { fotoSet = {}; });
}

let calMes = monthKey(dayKey());   /* 'YYYY-MM' que se está viendo */

VIEWS.calendario = function () {
  const y = +calMes.slice(0, 4), m = +calMes.slice(5, 7) - 1;
  const primero = new Date(y, m, 1);
  const offset = (primero.getDay() + 6) % 7;      /* lunes = 0 */
  const total = new Date(y, m + 1, 0).getDate();
  const hoy = dayKey();

  /* Totales por día del mes. */
  const porDia = {};
  state.entries.forEach(function (e) {
    if (monthKey(e.date) !== calMes) return;
    const d = porDia[e.date] || (porDia[e.date] = { earned: 0, saved: 0, spent: 0 });
    if (e.kind === 'earn') d.earned += e.amount;
    else if (e.kind === 'spend') d.spent += e.amount;
    else d.saved += (e.src === 'retiro' ? -e.amount : e.amount);
  });

  const mt = totals(state.entries.filter(function (e) { return monthKey(e.date) === calMes; }));
  const activos = Object.keys(porDia).length;

  let celdas = '';
  for (let i = 0; i < offset; i++) celdas += '<div class="cal__c is-blank"></div>';
  for (let d = 1; d <= total; d++) {
    const k = calMes + '-' + String(d).padStart(2, '0');
    const r = porDia[k];
    const futuro = k > hoy;
    /* El color dice de un vistazo cómo fue el día: verde si ahorraste más de
       lo que gastaste, rojo al revés, ámbar si empataste. */
    let tono = '';
    if (r && (r.saved || r.spent || r.earned)) {
      tono = r.saved > 0 && r.saved >= r.spent ? 'is-good'
           : r.spent > r.saved ? 'is-bad' : 'is-mid';
    }
    celdas +=
      '<button class="cal__c ' + tono + (k === hoy ? ' is-today' : '') +
        (futuro ? ' is-future' : '') + '" type="button" data-act="ver-dia" data-k="' + k + '"' +
        (futuro ? ' disabled' : '') + '>' +
        '<span class="cal__n num">' + d + '</span>' +
        (fotoSet[k] ? '<span class="cal__cam">' + ico('camera', 10) + '</span>' : '') +
      '</button>';
  }

  return '' +
  '<div class="subhead">' +
    '<button class="iconbtn" type="button" data-act="tab" data-tab="mas" aria-label="Volver">' +
      ico('left', 18) + '</button>' +
    '<h1 class="screen-title grow">Calendario</h1>' +
  '</div>' +

  '<section class="card stack-2">' +
    '<div class="spread">' +
      '<button class="iconbtn" type="button" data-act="cal-mes" data-d="-1" aria-label="Mes anterior">' +
        ico('left', 18) + '</button>' +
      '<b>' + MESES[m] + ' ' + y + '</b>' +
      '<button class="iconbtn" type="button" data-act="cal-mes" data-d="1" aria-label="Mes siguiente"' +
        (calMes >= monthKey(hoy) ? ' disabled style="opacity:.3"' : '') + '>' +
        ico('right', 18) + '</button>' +
    '</div>' +

    '<div class="cal__dows">' +
      DIAS_C.map(function (d) { return '<span>' + d + '</span>'; }).join('') +
    '</div>' +
    '<div class="cal">' + celdas + '</div>' +
  '</section>' +

  '<div class="stats">' +
    '<div class="stat"><div class="stat__k">Ahorrado</div>' +
      '<div class="stat__v num sav">' + money(mt.saved) + '</div></div>' +
    '<div class="stat"><div class="stat__k">Gastado</div>' +
      '<div class="stat__v num neg">' + money(mt.spent) + '</div></div>' +
    '<div class="stat"><div class="stat__k">Días</div>' +
      '<div class="stat__v num">' + activos + '</div></div>' +
  '</div>' +

  '<div class="cal__key t-cap faint">' +
    '<span><i class="cal__dot is-good"></i>Ahorraste más</span>' +
    '<span><i class="cal__dot is-bad"></i>Gastaste más</span>' +
    '<span><i class="cal__dot is-mid"></i>Parejo</span>' +
  '</div>';
};

/* Dibuja el bloque de foto del día. Se hace aparte del resto de la hoja
   porque IndexedDB es asíncrono y no queremos retrasar la apertura. */
function pintarFoto(k) {
  const box = $('#fotoBox');
  if (!box) return;
  fotoGet(k).then(function (rec) {
    if (!$('#fotoBox')) return;                  /* la hoja ya se cerró */
    if (rec && rec.blob) {
      const url = URL.createObjectURL(rec.blob);
      box.innerHTML =
        '<img class="fotobox__img" src="' + url + '" alt="Foto del ' + esc(fmtDate(k)) + '">' +
        '<div class="fotobox__bar">' +
          '<span class="t-cap faint">' + Math.round((rec.bytes || 0) / 1024) + ' KB</span>' +
          '<button class="btn btn--ghost" type="button" data-act="foto-cambiar" data-k="' + k + '">Cambiar</button>' +
          '<button class="btn btn--ghost neg" type="button" data-act="foto-borrar" data-k="' + k + '">Quitar</button>' +
        '</div>';
      /* Se libera el objeto URL al cerrar la hoja, para no dejar la imagen
         retenida en memoria mientras la app siga abierta. */
      const el = box.querySelector('img');
      el.addEventListener('load', function () { setTimeout(function () { URL.revokeObjectURL(url); }, 1000); });
    } else {
      box.innerHTML =
        '<button class="fotobox__add" type="button" data-act="foto-cambiar" data-k="' + k + '">' +
          ico('camera', 22) +
          '<span class="t-sub">Agregar foto del día</span>' +
          '<span class="t-cap faint">Un recibo, el súper, lo que quieras recordar</span>' +
        '</button>';
    }
    paintIcons(box);
  }).catch(function () {
    box.innerHTML = '<div class="t-cap faint">Las fotos no están disponibles en este navegador.</div>';
  });
}

function leerRecibo(file) {
  scanBusy = true;
  render(true);
  return encogerFoto(file)
    .then(function (r) {
      return new Promise(function (res, rej) {
        const fr = new FileReader();
        fr.onload = function () { res(String(fr.result)); };
        fr.onerror = function () { rej(new Error('no se pudo leer la foto')); };
        fr.readAsDataURL(r.blob);
      });
    })
    .then(function (dataUrl) {
      return fetch(GROQ_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + groqKey() },
        body: JSON.stringify({
          model: GROQ_VISION,
          temperature: 0,
          max_tokens: 1200,
          response_format: { type: 'json_object' },
          messages: [{
            role: 'user',
            content: [
              { type: 'text', text:
                'Lee este recibo de compra. Devuelve SOLO un objeto JSON con esta forma exacta: ' +
                '{"items":[{"name":"nombre del artículo","price":0.00}],"total":0.00,"currency":"USD"}. ' +
                'Usa punto decimal. No inventes artículos que no aparezcan. ' +
                'Si no distingues un precio, omite ese artículo. Nombres en español, cortos.' },
              { type: 'image_url', image_url: { url: dataUrl } },
            ],
          }],
        }),
      });
    })
    .then(function (res) {
      if (!res.ok) throw new Error(res.status === 401 ? 'clave inválida' : 'error ' + res.status);
      return res.json();
    })
    .then(function (d) {
      const raw = d && d.choices && d.choices[0] && d.choices[0].message &&
                  d.choices[0].message.content;
      if (!raw) throw new Error('respuesta vacía');
      let obj;
      try { obj = JSON.parse(raw); } catch (e) {
        /* A veces el modelo envuelve el JSON en texto; se rescata el objeto. */
        const m = String(raw).match(/\{[\s\S]*\}/);
        if (!m) throw new Error('respuesta ilegible');
        obj = JSON.parse(m[0]);
      }
      const items = (obj.items || []).map(function (it) {
        return { name: String(it.name || 'Artículo').slice(0, 60), price: Number(it.price) || 0, on: true };
      }).filter(function (it) { return it.price > 0; });
      if (!items.length) throw new Error('no se distinguió ningún artículo');
      /* El recibo está en la moneda que ves; se convierte a la base al guardar. */
      scanItems = items.map(function (it) { return { name: it.name, price: toBase(it.price), on: true }; });
      scanBusy = false;
      render(true);
      toast(items.length + ' artículo' + (items.length === 1 ? '' : 's') + ' detectado' +
            (items.length === 1 ? '' : 's'), 'ok');
    })
    .catch(function (err) {
      scanBusy = false;
      scanItems = null;
      render(true);
      toast('No se pudo leer el recibo: ' + (err.message || 'falló la conexión'), 'bad', 5000);
    });
}

/* Retrato de tus finanzas que se manda como contexto. Son cifras agregadas,
   nunca notas ni nada que identifique. */
function retrato() {
  const t = totals();
  const m = thisMonth();
  const mt = totals(inRange(m.from, m.to));
  const w = lastNDays(7);
  const wt = totals(inRange(w.from, w.to));
  const cats = byCategory(m.from, m.to).slice(0, 5);
  return {
    moneda: state.currency,
    total: { ganado: r2(t.earned), ahorrado: r2(t.saved), gastado: r2(t.spent), saldo: r2(t.balance) },
    este_mes: { ganado: r2(mt.earned), ahorrado: r2(mt.saved), gastado: r2(mt.spent) },
    ultimos_7_dias: { ahorrado: r2(wt.saved), gastado: r2(wt.spent) },
    racha_dias: streak(),
    nivel: level().now.name,
    top_categorias_mes: cats.map(function (c) { return { categoria: c.cat.name, gastado: r2(c.amount) }; }),
    metas: state.goals.map(function (g) {
      return { nombre: g.name, objetivo: r2(g.target), llevo: r2(goalSaved(g)),
               porcentaje: goalPct(g), cumplida: g.done };
    }),
    presupuestos: state.budgets.map(function (b) {
      return { categoria: cat(b.cat).name, tope: r2(b.amount), usado: r2(budgetSpent(b)), periodo: b.period };
    }),
    compras_pendientes: state.shop.filter(function (i) { return !i.done; }).length,
  };
}
function r2(n) { return Math.round(toView(n) * 100) / 100; }

/* Respuestas sin conexión ni clave. En la versión anterior este motor existía
   pero nunca se llamaba: sin clave la app simplemente no contestaba. */
function responderLocal(q) {
  const s = q.toLowerCase();
  const t = totals();
  const m = thisMonth();
  const mt = totals(inRange(m.from, m.to));
  const cats = byCategory(m.from, m.to);

  if (/gast(o|as|é|e)\b|en qu[eé]|categor/.test(s)) {
    if (!cats.length) return 'Todavía no tienes gastos registrados este mes.';
    const top = cats[0];
    return 'Este mes lo que más te cuesta es ' + top.cat.name + ': ' + money(top.amount) +
      ' de ' + money(mt.spent) + ' en total, o sea el ' + pct(top.amount, mt.spent) + '%.' +
      (cats[1] ? ' Después va ' + cats[1].cat.name + ' con ' + money(cats[1].amount) + '.' : '');
  }
  if (/ahorr|alcanc[ií]a|guardad/.test(s)) {
    const lv = level();
    return 'Llevas ' + money(t.saved) + ' en la alcancía, nivel ' + lv.now.name + '.' +
      (lv.next ? ' Con ' + money(lv.next.min - t.saved) + ' más llegas a ' + lv.next.name + '.' : '') +
      ' Este mes has guardado ' + money(mt.saved) + '.';
  }
  if (/meta|objetivo|llego/.test(s)) {
    const abiertas = state.goals.filter(function (g) { return !g.done; });
    if (!state.goals.length) return 'Todavía no tienes metas. Crea una en la pestaña Metas y le doy seguimiento.';
    if (!abiertas.length) return '¡Ya cumpliste todas tus metas! Puedes crear otra cuando quieras.';
    const g = abiertas.sort(function (a, b) { return goalPct(b) - goalPct(a); })[0];
    const falta = g.target - goalSaved(g);
    const dias = g.due ? daysBetween(dayKey(), g.due) : null;
    return 'Tu meta más cerca es "' + g.name + '": vas al ' + goalPct(g) + '%, te faltan ' +
      money(falta) + '.' + (dias && dias > 0
        ? ' Con ' + dias + ' días por delante necesitas guardar ' + money(falta / dias) + ' al día.'
        : '');
  }
  if (/presupuest|tope|l[ií]mite/.test(s)) {
    if (!state.budgets.length) return 'No tienes presupuestos. Ponle un tope a una categoría y te aviso al acercarte.';
    return state.budgets.map(function (b) {
      const u = budgetSpent(b);
      return cat(b.cat).name + ': ' + money(u) + ' de ' + money(b.amount) +
        (u > b.amount ? ' (te pasaste)' : ' (' + pct(u, b.amount) + '%)');
    }).join('. ') + '.';
  }
  if (/c[oó]mo voy|mes|resumen|balance|saldo/.test(s)) {
    return 'Este mes: ganaste ' + money(mt.earned) + ', ahorraste ' + money(mt.saved) +
      ' y gastaste ' + money(mt.spent) + '. Tu saldo es ' + money(t.balance) +
      ' y llevas ' + streak() + ' días seguidos registrando.';
  }
  if (/consejo|ayuda|tip|qu[eé] hago/.test(s)) {
    if (mt.spent > mt.earned && mt.earned > 0) {
      return 'Este mes gastaste más de lo que ganaste. Mira la pestaña Análisis: ' +
        'la categoría de arriba suele ser la más fácil de recortar.';
    }
    if (mt.earned > 0 && mt.saved / mt.earned < 0.1) {
      return 'Estás guardando menos del 10% de lo que ganas. Prueba a apartar ' +
        money(mt.earned * 0.2 / 30) + ' cada día: en un mes son ' + money(mt.earned * 0.2) + '.';
    }
    return 'Vas bien. Lo que más ayuda ahora es no romper la racha: registra algo cada día, ' +
      'aunque sea un gasto chico.';
  }
  return 'Puedo contarte cómo vas este mes, en qué gastas más, cuánto llevas ahorrado, ' +
    'si llegas a tu meta o cómo van tus presupuestos. Pregúntame cualquiera de esas.';
}

function chatEnviar(txt) {
  const q = String(txt || '').trim();
  if (!q || chatBusy) return;
  chat.push({ rol: 'yo', txt: q });
  const key = groqKey();

  if (!key) {
    chat.push({ rol: 'ella', txt: responderLocal(q) });
    render(true);
    scrollChat();
    return;
  }

  chatBusy = true;
  render(true);
  scrollChat();

  const historial = chat.filter(function (m) { return m.rol !== 'sys'; })
    .slice(-8).map(function (m) {
      return { role: m.rol === 'yo' ? 'user' : 'assistant', content: m.txt };
    });

  fetch(GROQ_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: GROQ_CHAT,
      temperature: 0.5,
      max_tokens: 400,
      messages: [{
        role: 'system',
        content:
          'Eres el asistente de "Mi Alcancía", una app de ahorro personal. Respondes en ' +
          'español latinoamericano, de tú, en tono cercano y directo. Máximo 4 frases. ' +
          'Nunca inventes cifras: usa solo las del JSON. Si te falta un dato, dilo. ' +
          'Los importes ya vienen en la moneda del usuario.\n' +
          'Datos del usuario: ' + JSON.stringify(retrato()),
      }].concat(historial),
    }),
  })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status === 401 ? 'clave inválida' : 'error ' + r.status);
      return r.json();
    })
    .then(function (d) {
      const txt = d && d.choices && d.choices[0] && d.choices[0].message &&
                  d.choices[0].message.content;
      chatBusy = false;
      chat.push({ rol: 'ella', txt: (txt || '').trim() || responderLocal(q) });
      render(true);
      scrollChat();
    })
    .catch(function (err) {
      /* Sin red o con la clave mala se contesta igual, con el motor local: es
         mejor una respuesta útil que un mensaje de error. */
      chatBusy = false;
      chat.push({ rol: 'ella', txt: responderLocal(q) });
      render(true);
      scrollChat();
      toast('Sin conexión con Groq (' + (err.message || 'falló') + '): respondo con lo local', 'bad', 4000);
    });
}

function scrollChat() {
  const b = $('#chatBox');
  if (b) b.scrollTop = b.scrollHeight;
  const sc = $('#scroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
}

/* Un solo escucha para toda la app. No hay ni un onclick= en el HTML, así que
   no existe la clase de fallo donde una función se renombra y un botón deja
   de responder en silencio. */
const ACTIONS = {

  tab: function (el) { go(el.dataset.tab); },

  ir: function (el) { go(el.dataset.go); },

  brief: function (el) {
    const parts = String(el.dataset.go || '').split(':');
    if (parts[0] === 'nuevo') openEntrySheet(parts[1]);
    else if (parts[0] === 'ir') go(parts[1]);
  },

  nuevo: function (el) { openEntrySheet(el.dataset.kind); },

  'cerrar-hoja': function () { closeSheet(); try { history.back(); } catch (e) {} },

  'cambiar-tipo': function (el) {
    /* Conserva lo ya escrito al cambiar de tipo: volver a teclear la cantidad
       porque elegiste mal el botón es una molestia evitable. */
    const amount = ($('#mAmount') || {}).value || '';
    const note = ($('#mNote') || {}).value || '';
    const date = ($('#mDate') || {}).value || dayKey();
    openEntrySheet(el.dataset.kind);
    setTimeout(function () {
      if ($('#mAmount')) $('#mAmount').value = amount;
      if ($('#mNote')) $('#mNote').value = note;
      if ($('#mDate')) $('#mDate').value = date;
    }, 0);
  },

  'elegir-cat': function (el) {
    $$('.catopt').forEach(function (b) { b.classList.remove('is-on'); });
    el.classList.add('is-on');
    haptic(6);
  },

  'dir-ahorro': function (el) {
    $$('#mDir .seg__btn').forEach(function (b) { b.classList.remove('is-on'); });
    el.classList.add('is-on');
  },

  'guardar-mov': function (el) {
    const kind = el.dataset.kind;
    const id = el.dataset.id || null;
    const rec = readEntrySheet(kind, id);
    if (!rec) return;

    if (id) {
      const i = state.entries.findIndex(function (e) { return e.id === id; });
      if (i >= 0) state.entries[i] = rec; else state.entries.push(rec);
    } else {
      state.entries.push(rec);
    }
    state.entries.sort(function (a, b) { return b.ts - a.ts; });

    /* Al cumplirse una meta se marca sola: obligarte a cerrarla a mano hacía
       que el logro 'Meta Alcanzada' no se disparara nunca. */
    const antes = state.goals.filter(function (g) { return g.done; }).length;
    const r = reconcile();
    const cumplidas = state.goals.filter(function (g) { return g.done; }).length - antes;
    if (cumplidas > 0) {
      setTimeout(function () { toast('🎯 ¡Meta cumplida!', 'ok', 4000); }, 400);
    }
    const nuevos = r.nuevos;
    save(true);
    closeSheet(true);
    try { history.back(); } catch (e) {}
    haptic(12);
    render();
    if (kind === 'save' && rec.src !== 'retiro') bouncePig();
    toast(id ? 'Movimiento actualizado' : KINDS[kind].verb + ' registrado', 'ok');
    celebrate(nuevos);
    checkBudgets(rec);
  },

  'ver-mov': function (el) {
    const e = state.entries.find(function (x) { return x.id === el.dataset.id; });
    if (e) openEntrySheet(e.kind, e);
  },

  'borrar-mov': function (el) {
    const id = el.dataset.id;
    const i = state.entries.findIndex(function (e) { return e.id === id; });
    if (i < 0) return;
    const copia = state.entries[i];
    state.entries.splice(i, 1);
    save(true);
    closeSheet(true);
    try { history.back(); } catch (e) {}
    render();
    /* Deshacer de verdad: la versión anterior ofrecía el botón pero el
       movimiento ya no se podía recuperar. */
    undoable('Movimiento borrado', function () {
      state.entries.push(copia);
      state.entries.sort(function (a, b) { return b.ts - a.ts; });
      save(true);
      render();
    });
  },

  trabajo: function (el) {
    const k = dayKey();
    const want = el.dataset.val === '1';
    const cur = state.days[k] ? state.days[k].worked : null;
    if (cur === want) delete state.days[k];        /* volver a tocar lo quita */
    else state.days[k] = { worked: want };
    save();
    haptic(8);
    render(true);
  },

  'tocar-cerdo': function () { bouncePig(); haptic(10); },

  privacidad: function () {
    state.privacy = !state.privacy;
    save();
    applyPrivacy();
    render(true);
    toast(state.privacy ? 'Cantidades ocultas' : 'Cantidades visibles');
  },

  'ver-racha': function () {
    const n = streak();
    toast(n > 0
      ? 'Llevas ' + n + (n === 1 ? ' día seguido' : ' días seguidos') + ' registrando'
      : 'Registra algo hoy para empezar tu racha');
  },

  ajustes: function () { go('ajustes'); },

  filtro: function (el) {
    state.filters[el.dataset.k] = el.dataset.v;
    save();
    render(true);
  },

  'limpiar-filtros': function () {
    state.filters = { q: '', kind: 'all', range: 'all', cat: 'all' };
    save();
    render(true);
  },

  /* — Metas — */
  'nueva-meta': function () { openGoalSheet(null); },

  'editar-meta': function (el) {
    const g = state.goals.find(function (x) { return x.id === el.dataset.id; });
    if (g) openGoalSheet(g);
  },

  'guardar-meta': function (el) {
    const name = (($('#gName') || {}).value || '').trim();
    const target = toBase(parseFloat((($('#gTarget') || {}).value || '').replace(',', '.')));
    if (!name) { toast('Ponle un nombre a la meta', 'bad'); return; }
    if (!isFinite(target) || target <= 0) { toast('¿Cuánto necesitas juntar?', 'bad'); return; }
    const dueEl = $('#gDue');
    const due = dueEl && DATE_RE.test(dueEl.value) ? dueEl.value : null;
    const id = el.dataset.id;
    const prev = id ? state.goals.find(function (x) { return x.id === id; }) : null;

    if (prev) {
      prev.name = name.slice(0, 60);
      prev.target = target;
      prev.due = due;
      /* Si al subir el objetivo la meta deja de estar cumplida, se reabre. */
      if (prev.done && goalSaved(prev) < target) { prev.done = false; prev.doneAt = null; }
    } else {
      state.goals.push({
        id: uid(), name: name.slice(0, 60), target: target,
        since: dayKey(), due: due, done: false, doneAt: null,
      });
    }
    /* Se revisa al momento: si hoy ya guardaste lo suficiente, la meta nace
       cumplida en vez de quedarse al 100% pero abierta hasta el siguiente
       movimiento. */
    const r = reconcile();
    save(true);
    closeSheet(true);
    try { history.back(); } catch (e) {}
    render();
    toast(prev ? 'Meta actualizada' : 'Meta creada', 'ok');
    celebrate(r.nuevos);
  },

  'borrar-meta': function (el) {
    const i = state.goals.findIndex(function (g) { return g.id === el.dataset.id; });
    if (i < 0) return;
    const copia = state.goals[i];
    state.goals.splice(i, 1);
    save(true);
    closeSheet(true);
    try { history.back(); } catch (e) {}
    render();
    undoable('Meta borrada', function () {
      state.goals.push(copia); save(true); render();
    });
  },

  /* — Presupuestos — */
  'nuevo-presupuesto': function () { openBudgetSheet(null); },

  'editar-presupuesto': function (el) {
    const b = state.budgets.find(function (x) { return x.id === el.dataset.id; });
    if (b) openBudgetSheet(b);
  },

  'elegir-periodo': function (el) {
    $$('#bPeriod .seg__btn').forEach(function (n) { n.classList.remove('is-on'); });
    el.classList.add('is-on');
  },

  'guardar-presupuesto': function (el) {
    const amount = toBase(parseFloat((($('#bAmount') || {}).value || '').replace(',', '.')));
    if (!isFinite(amount) || amount <= 0) { toast('Escribe un tope mayor que cero', 'bad'); return; }
    const on = $('.catopt.is-on');
    const per = $('#bPeriod .seg__btn.is-on');
    const rec = {
      id: el.dataset.id || uid(),
      cat: on ? on.dataset.cat : 'general',
      amount: amount,
      period: per ? per.dataset.v : 'mensual',
    };
    /* Un tope por categoría y periodo: dos presupuestos iguales hacían que el
       segundo nunca pudiera avisar en la versión anterior. */
    const dup = state.budgets.find(function (b) {
      return b.id !== rec.id && b.cat === rec.cat && b.period === rec.period;
    });
    if (dup) { toast('Ya tienes un tope ' + rec.period + ' para ' + cat(rec.cat).name, 'bad'); return; }

    const i = state.budgets.findIndex(function (b) { return b.id === rec.id; });
    if (i >= 0) state.budgets[i] = rec; else state.budgets.push(rec);
    save(true);
    closeSheet(true);
    try { history.back(); } catch (e) {}
    render();
    toast('Presupuesto guardado', 'ok');
  },

  'borrar-presupuesto': function (el) {
    const i = state.budgets.findIndex(function (b) { return b.id === el.dataset.id; });
    if (i < 0) return;
    const copia = state.budgets[i];
    state.budgets.splice(i, 1);
    save(true);
    closeSheet(true);
    try { history.back(); } catch (e) {}
    render();
    undoable('Presupuesto borrado', function () {
      state.budgets.push(copia); save(true); render();
    });
  },

  /* — Calendario — */
  'cal-mes': function (el) {
    const d = +el.dataset.d;
    const y = +calMes.slice(0, 4), m = +calMes.slice(5, 7) - 1 + d;
    const n = new Date(y, m, 1);
    const k = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
    if (k > monthKey(dayKey())) return;          /* no se navega al futuro */
    calMes = k;
    render(true);
  },

  'ver-dia': function (el) { openDaySheet(el.dataset.k); },

  'foto-cambiar': function (el) {
    const k = el.dataset.k;
    const inp = $('#fotoIn');
    if (!inp) return;
    inp.value = '';
    inp.onchange = function () {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const box = $('#fotoBox');
      if (box) box.innerHTML = '<div class="t-cap faint">Procesando foto…</div>';
      encogerFoto(f)
        .then(function (r) {
          return fotoPut({
            key: k, blob: r.blob, w: r.w, h: r.h,
            bytes: r.bytes, type: r.type, addedAt: new Date().toISOString(),
          });
        })
        .then(function () { fotoSet[k] = true; pintarFoto(k); toast('Foto guardada', 'ok'); })
        .catch(function () {
          toast('No se pudo guardar la foto', 'bad');
          pintarFoto(k);
        });
    };
    inp.click();
  },

  'foto-borrar': function (el) {
    const k = el.dataset.k;
    fotoDel(k).then(function () {
      delete fotoSet[k];
      pintarFoto(k);
      toast('Foto quitada');
    }).catch(function () { toast('No se pudo quitar', 'bad'); });
  },

  /* — Compras — */
  'agregar-item': function () {
    const nEl = $('#shopName'), qEl = $('#shopQty');
    const name = (nEl.value || '').trim();
    if (!name) { nEl.focus(); return; }
    /* Si ya está en la lista sin comprar, se sube su prioridad en vez de
       duplicar la línea. */
    const dup = state.shop.find(function (i) {
      return !i.done && i.name.toLowerCase() === name.toLowerCase();
    });
    if (dup) {
      toast('"' + dup.name + '" ya está en la lista');
      nEl.value = ''; qEl.value = '';
      return;
    }
    /* Recupera el último precio anotado para este artículo. */
    const mem = state.prices.filter(function (p) {
      return p.name.toLowerCase() === name.toLowerCase();
    })[0];
    state.shop.push({
      id: uid(), name: name.slice(0, 80), qty: (qEl.value || '').trim().slice(0, 20),
      price: mem ? mem.price : 0, cat: 'shopping', prio: 'media',
      done: false, logged: false, ts: Date.now(),
    });
    nEl.value = ''; qEl.value = '';
    save();
    haptic(8);
    render(true);
    const n = $('#shopName'); if (n) n.focus();
  },

  'marcar-item': function (el) {
    const i = state.shop.find(function (x) { return x.id === el.dataset.id; });
    if (!i) return;
    i.done = !i.done;
    save();
    haptic(8);
    render(true);
  },

  'editar-item': function (el) {
    const i = state.shop.find(function (x) { return x.id === el.dataset.id; });
    if (i) openItemSheet(i);
  },

  'elegir-prio': function (el) {
    $$('#iPrio .seg__btn').forEach(function (n) { n.classList.remove('is-on'); });
    el.classList.add('is-on');
  },

  'guardar-item': function (el) {
    const i = state.shop.find(function (x) { return x.id === el.dataset.id; });
    if (!i) return;
    const name = (($('#iName') || {}).value || '').trim();
    if (!name) { toast('El artículo necesita nombre', 'bad'); return; }
    i.name = name.slice(0, 80);
    i.qty = (($('#iQty') || {}).value || '').trim().slice(0, 20);
    const pr = parseFloat((($('#iPrice') || {}).value || '').replace(',', '.'));
    i.price = isFinite(pr) && pr > 0 ? toBase(pr) : 0;
    const pri = $('#iPrio .seg__btn.is-on');
    i.prio = pri ? pri.dataset.v : 'media';
    recordarPrecio(i);
    save(true);
    closeSheet(true);
    try { history.back(); } catch (e) {}
    render(true);
    toast('Artículo actualizado', 'ok');
  },

  'borrar-item': function (el) {
    const idx = state.shop.findIndex(function (x) { return x.id === el.dataset.id; });
    if (idx < 0) return;
    const copia = state.shop[idx];
    state.shop.splice(idx, 1);
    save(true);
    if (sheetEl) { closeSheet(true); try { history.back(); } catch (e) {} }
    render(true);
    undoable('"' + copia.name + '" quitado', function () {
      state.shop.push(copia); save(true); render(true);
    });
  },

  'limpiar-comprados': function () {
    const quitados = state.shop.filter(function (i) { return i.done; });
    if (!quitados.length) return;
    state.shop = state.shop.filter(function (i) { return !i.done; });
    save(true);
    render(true);
    undoable(quitados.length + ' artículo' + (quitados.length === 1 ? '' : 's') + ' fuera de la lista',
      function () { state.shop = state.shop.concat(quitados); save(true); render(true); });
  },

  /* Convierte lo ya comprado en gastos reales. Cada artículo se marca como
     registrado para que pulsar dos veces no duplique el gasto — ese control
     ya existía en la versión anterior y se conserva. */
  'compras-a-gasto': function () {
    const items = state.shop.filter(function (i) { return i.done && !i.logged && i.price > 0; });
    if (!items.length) return;
    const hoy = dayKey();
    let total = 0;
    items.forEach(function (i) {
      const cant = parseFloat(i.qty) || 1;
      const monto = i.price * cant;
      total += monto;
      state.entries.push({
        id: uid(), date: hoy, kind: 'spend', amount: monto,
        cat: i.cat || 'shopping', note: i.name, ts: Date.now(), grp: null, src: 'compra',
      });
      i.logged = true;
      recordarPrecio(i);
    });
    state.entries.sort(function (a, b) { return b.ts - a.ts; });
    const r = reconcile();
    save(true);
    haptic(14);
    render(true);
    toast(money(total) + ' registrado como gasto', 'ok');
    celebrate(r.nuevos);
  },
};

/* — Datos y ajustes — */

ACTIONS.moneda = function (el) {
  state.currency = el.dataset.v;
  save();
  render(true);
  refreshRates();
};

ACTIONS.tema = function (el) {
  state.theme = el.dataset.v;
  save();
  applyTheme();
  render(true);
};

ACTIONS.exportar = function () {
  const payload = {
    app: 'Mi Alcancía',
    version: 2,
    exportedAt: new Date().toISOString(),
    state: state,
  };
  let url;
  try {
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    url = URL.createObjectURL(blob);
  } catch (e) { toast('No se pudo crear el archivo', 'bad'); return; }
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mi-alcancia-' + dayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  toast('Respaldo descargado', 'ok');
};

ACTIONS.importar = function () {
  const inp = $('#impIn');
  if (!inp) return;
  inp.value = '';
  inp.onchange = function () {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = function () {
      let parsed;
      try { parsed = JSON.parse(String(fr.result)); } catch (e) {
        toast('Ese archivo no es un respaldo válido', 'bad', 4000);
        return;
      }
      /* Acepta tanto el envoltorio {app, state} como un estado suelto. */
      const incoming = parsed && parsed.state ? parsed.state : parsed;
      if (!incoming || !Array.isArray(incoming.entries)) {
        toast('El archivo no contiene movimientos', 'bad', 4000);
        return;
      }
      const base = blank();
      Object.keys(base).forEach(function (k) {
        if (incoming[k] !== undefined && incoming[k] !== null) base[k] = incoming[k];
      });
      base.v = SCHEMA;
      state = base;
      readFailed = false;                 /* el archivo es legible: se puede guardar */
      sanitize();
      reconcile();
      save(true);
      applyTheme();
      applyPrivacy();
      render();
      toast('Restaurado: ' + state.entries.length + ' movimientos', 'ok', 4000);
    };
    fr.onerror = function () { toast('No se pudo leer el archivo', 'bad'); };
    fr.readAsText(f);
  };
  inp.click();
};

ACTIONS['reimportar-v1'] = function () {
  openSheet('Traer datos anteriores',
    '<p class="t-sub">Se reemplaza todo lo que tengas en esta versión por lo que ' +
      'haya en la versión anterior de Mi Alcancía.</p>' +
    '<p class="t-cap faint">La versión anterior no se toca: sus datos se copian, ' +
      'no se mueven, y puedes seguir usándola igual que hasta ahora.</p>' +
    '<button class="btn btn--primary btn--lg btn--block" type="button" ' +
      'data-act="reimportar-v1-ok">Traer los datos</button>');
};

ACTIONS['reimportar-v1-ok'] = function () {
  state = blank();
  readFailed = false;
  migrateFromV1();
  if (!state.entries.length && !state.goals.length) {
    toast('No se encontraron datos que traer', 'bad');
  }
  reconcile();
  save(true);
  closeSheet(true);
  try { history.back(); } catch (e) {}
  render();
};

ACTIONS['borrar-todo'] = function () {
  openSheet('Borrar todo',
    '<p class="t-sub">Se van a borrar <b>' + state.entries.length + ' movimientos</b>, ' +
      state.goals.length + ' metas, ' + state.shop.length + ' artículos y ' +
      Object.keys(fotoSet).length + ' fotos.</p>' +
    '<p class="t-cap faint">Esto no se puede deshacer. Si no has bajado un respaldo, ' +
      'ciérralo y hazlo antes.</p>' +
    '<button class="btn btn--danger btn--lg btn--block" type="button" ' +
      'data-act="borrar-todo-ok">Sí, borrar todo</button>' +
    '<button class="btn btn--soft btn--block" type="button" data-act="cerrar-hoja">Mejor no</button>');
};

ACTIONS['borrar-todo-ok'] = function () {
  Object.keys(fotoSet).forEach(function (k) { fotoDel(k).catch(function () {}); });
  fotoSet = {};
  state = blank();
  state.onboarded = true;
  readFailed = false;
  try { localStorage.removeItem(KEY_BAK); } catch (e) {}
  save(true);
  closeSheet(true);
  try { history.back(); } catch (e) {}
  applyTheme();
  applyPrivacy();
  render();
  toast('Todo borrado');
};

/* — Recetas — */

ACTIONS['receta-cat'] = function (el) { recetaCat = el.dataset.v; render(true); };
ACTIONS['ver-receta'] = function (el) { openRecetaSheet(+el.dataset.i); };

ACTIONS['receta-a-compras'] = function (el) {
  const r = RECETAS[+el.dataset.i];
  if (!r) return;
  let nuevos = 0;
  r.ingredients.forEach(function (g) {
    const nombre = String(g.n).trim();
    if (!nombre) return;
    const ya = state.shop.some(function (i) {
      return !i.done && i.name.toLowerCase() === nombre.toLowerCase();
    });
    if (ya) return;
    const mem = state.prices.filter(function (p) {
      return p.name.toLowerCase() === nombre.toLowerCase();
    })[0];
    state.shop.push({
      id: uid(), name: nombre.slice(0, 80), qty: String(g.a || '').slice(0, 20),
      price: mem ? mem.price : 0, cat: 'food', prio: 'media',
      done: false, logged: false, ts: Date.now(),
    });
    nuevos++;
  });
  save(true);
  closeSheet(true);
  try { history.back(); } catch (e) {}
  haptic(12);
  toast(nuevos
    ? nuevos + ' ingrediente' + (nuevos === 1 ? '' : 's') + ' a tu lista'
    : 'Ya tenías todos en la lista', nuevos ? 'ok' : null);
};

/* — Escanear — */

ACTIONS['guardar-key'] = function () {
  const v = (($('#gk') || {}).value || '').trim();
  if (!v) { toast('Pega la clave primero', 'bad'); return; }
  setGroqKey(v);
  render(true);
  toast('Clave guardada en este teléfono', 'ok');
};

ACTIONS['borrar-key'] = function () {
  setGroqKey('');
  render(true);
  toast('Clave borrada');
};

ACTIONS['scan-foto'] = function () {
  const inp = $('#scanIn');
  if (!inp) return;
  inp.value = '';
  inp.onchange = function () {
    const f = inp.files && inp.files[0];
    if (f) leerRecibo(f);

  inp.click();
};

ACTIONS['scan-descartar'] = function () { scanItems = null; render(true); };

ACTIONS['scan-gasto'] = function () {
  const sel = (scanItems || []).filter(function (i) { return i.on; });
  if (!sel.length) { toast('Marca al menos un artículo', 'bad'); return; }
  const hoy = dayKey();
  let total = 0;
  sel.forEach(function (i, n) {
    total += i.price;
    state.entries.push({
      id: uid(), date: hoy, kind: 'spend', amount: i.price,
      cat: 'shopping', note: i.name, ts: Date.now() + n, grp: null, src: 'scan',
    });
  });
  state.entries.sort(function (a, b) { return b.ts - a.ts; });
  const r = reconcile();
  scanItems = null;
  save(true);
  haptic(14);
  go('actividad');

  celebrate(r.nuevos);

ACTIONS['scan-compras'] = function () {
  const sel = (scanItems || []).filter(function (i) { return i.on; });
  if (!sel.length) { toast('Marca al menos un artículo', 'bad'); return; }
  sel.forEach(function (i) {
    state.shop.push({
      id: uid(), name: i.name, qty: '', price: i.price, cat: 'shopping',
      prio: 'media', done: false, logged: false, ts: Date.now(),
    });
  });
  scanItems = null;
  save(true);
  go('compras');
  toast(sel.length + ' artículo' + (sel.length === 1 ? '' : 's') + ' a tu lista', 'ok');
};

/* — Asistente — */

ACTIONS['chat-enviar'] = function () {
  const el = $('#chatIn');
  if (!el) return;
  const q = el.value;
  el.value = '';
  chatEnviar(q);
};
ACTIONS['chat-chip'] = function (el) { chatEnviar(el.dataset.q); };
ACTIONS['chat-limpiar'] = function () { chat = []; render(true); };
ACTIONS.noop = function () {};

/* Enter envía en el chat y en el buscador de recetas no hace nada raro. */
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' || !ev.target || ev.target.id !== 'chatIn') return;
  ev.preventDefault();
  ACTIONS['chat-enviar']();
});

/* Buscador de recetas y casillas del escaneo. */
document.addEventListener('input', function (ev) {
  const t = ev.target;
  if (!t) return;
  if (t.id === 'rq') {
    const v = t.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      recetaQ = v;
      render(true);
      const n = $('#rq');
      if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 220);
  }
  if (t.classList && t.classList.contains('scanrow__ck') && scanItems) {
    const i = +t.dataset.i;
    if (scanItems[i]) scanItems[i].on = t.checked;
    const tot = $('#scanTotal');
    if (tot) tot.textContent = money(scanItems.reduce(function (s, x) {
      return s + (x.on ? x.price : 0);
    }, 0));
  }
});

/* Memoria de precios: recuerda lo último que pagaste por cada artículo para
   sugerirlo la próxima vez. Se limita a 300 registros. */
function recordarPrecio(i) {
  if (!i.price) return;
  state.prices = state.prices.filter(function (p) {
    return p.name.toLowerCase() !== i.name.toLowerCase();
  });
  state.prices.unshift({ name: i.name, price: i.price, date: dayKey() });
  state.prices = state.prices.slice(0, 300);
}

/* Enter en el campo de la lista de compras agrega el artículo. */
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  const t = ev.target;
  if (!t || (t.id !== 'shopName' && t.id !== 'shopQty')) return;
  ev.preventDefault();
  ACTIONS['agregar-item']();
});

/* La búsqueda se repinta con retraso: sin esto cada tecla vuelve a construir
   la lista entera, que era justo lo que hacía lenta la versión anterior. */
let qTimer = null;
document.addEventListener('input', function (ev) {
  if (!ev.target || ev.target.id !== 'fq') return;
  const v = ev.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(function () {
    state.filters.q = v;
    save();
    render(true);
    /* Devuelve el cursor al buscador para poder seguir escribiendo. */
    const n = $('#fq');
    if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  }, 220);
});

function bouncePig() {
  const p = $('.hero__pig');
  if (!p) return;
  p.classList.remove('is-happy');
  void p.offsetWidth;               /* reinicia la animación */
  p.classList.add('is-happy');
}

/* Aviso con deshacer. Mantiene una sola acción pendiente a la vez. */
let undoFn = null;
function undoable(msg, fn) {
  undoFn = fn;
  const host = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.pointerEvents = 'auto';
  el.innerHTML = '<span>' + esc(msg) + '</span>' +
    '<button class="btn btn--ghost toast__undo" type="button" data-act="deshacer">Deshacer</button>';
  host.appendChild(el);
  setTimeout(function () {
    if (undoFn === fn) undoFn = null;
    el.classList.add('is-out');
    setTimeout(function () { el.remove(); }, 260);
  }, 5000);
}
ACTIONS.deshacer = function (el) {
  if (undoFn) { undoFn(); undoFn = null; toast('Restaurado', 'ok'); }
  const t = el.closest('.toast');
  if (t) t.remove();
};

/* Avisa si un gasto acaba de rebasar un presupuesto. */
function checkBudgets(rec) {
  if (!rec || rec.kind !== 'spend') return;
  state.budgets.forEach(function (b) {
    if (b.cat !== rec.cat) return;
    const used = budgetSpent(b);
    if (used > b.amount) {
      setTimeout(function () {
        toast('Rebasaste el presupuesto de ' + cat(b.cat).name, 'bad', 4200);
      }, 700);
    } else if (used >= b.amount * 0.8) {
      setTimeout(function () {
        toast(cat(b.cat).name + ': ' + pct(used, b.amount) + '% del presupuesto', 'bad', 3600);
      }, 700);
    }
  });
}

/* Delegación. Sube desde el elemento tocado hasta encontrar un data-act. */
document.addEventListener('click', function (ev) {
  const el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  fn(el, ev);
});

/* ── 10. ARRANQUE ────────────────────────────────────────────────────────── */

function boot() {
  load();
  applyTheme();

  if (readFailed) {
    /* Se abre vacía y se dice por qué, sin escribir nada encima. */
    setTimeout(function () {
      toast('No se pudieron leer tus datos guardados. La app abre vacía y no ' +
            'guardará nada para no perderlos.', 'bad', 9000);
    }, 700);
  }

  /* Pone al día metas y logros con los datos que ya existen: sin esto, quien
     importa su historial de la versión anterior abre con todos los logros en
     cero pese a llevar meses ahorrando. */
  const r = reconcile();
  if (r.changed) save();

  applyPrivacy();
  go(state.tab || 'hoy');
  refreshRates();

  /* Las claves de foto se cargan aparte: IndexedDB es asíncrono y la app no
     debe esperar a que responda para pintar la primera pantalla. */
  cargarFotoKeys().then(function () {
    if (state.tab === 'calendario') render(true);
  });

  /* Al volver de segundo plano después de medianoche, "hoy" cambió: hay que
     repintar o la pantalla sigue mostrando el día anterior. */
  let lastDay = dayKey();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (dayKey() !== lastDay) { lastDay = dayKey(); render(); }
  });

  /* Guarda de inmediato antes de que la pestaña se cierre. */
  window.addEventListener('pagehide', function () { save(true); });

  /* Service worker: solo para poder abrir la app sin conexión. Se registra
     tarde, cuando la primera pantalla ya está pintada, para no competir con
     ella. Falla en silencio al abrir el archivo con file://, que es normal. */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
}

/* Tipos de cambio, una vez al día. Si no hay red se sigue con la caché; la
   moneda base es USD, así que sin tasas la app funciona igual en dólares. */
function refreshRates() {
  if (state.currency === 'USD' && state.rates) return;
  if (state.ratesAt === dayKey() && state.rates) return;
  try {
    fetch('https://open.er-api.com/v6/latest/USD')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.rates) return;
        state.rates = d.rates;
        state.ratesAt = dayKey();
        save();
        if (state.currency !== 'USD') render(true);
      })
      .catch(function () {});
  } catch (e) {}
}

boot();
</script>
